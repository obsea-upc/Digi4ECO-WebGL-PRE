<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Digi4ECO</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">

    <style>
        html, body {
            background: #CCCCCC;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #gameContainer {
            position: absolute;
            inset: 0;
            margin: 0;
            padding: 0;
            width: 100% !important;
            height: 100% !important;
            background: transparent !important;
        }

        #gameContainer canvas {
            position: absolute;
            inset: 0;
            width: 100% !important;     /* Fuerza visible 100% */
            height: 100% !important;    /* Fuerza visible 100% */
            -webkit-user-select: none;
            user-select: none;
            image-rendering: pixelated; /* Opcional: menos blur en upscale (prueba con/ sin) */
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <canvas id="unity-canvas" tabindex="-1"></canvas>

        <script src="Build/Digi4ECO-WebGL-PRE.loader.js"></script>
        <script>
            var canvas = document.querySelector("#unity-canvas");

            var config = {
                dataUrl: "Build/Digi4ECO-WebGL-PRE.data",
                frameworkUrl: "Build/Digi4ECO-WebGL-PRE.framework.js",
                codeUrl: "Build/Digi4ECO-WebGL-PRE.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "UPC",
                productName: "Digi4ECO",
                productVersion: "1.0.4",
                autoSyncPersistentDataPath: true,

                // ¡Importante! Desactiva la sincronización automática
                matchWebGLToCanvasSize: false
            };

            // Nuevos valores: límites de resolución interna (cámbialos a tu gusto)
            const MAX_RENDER_WIDTH  = 1024;
            const MAX_RENDER_HEIGHT = 768;

            function onResize() {
                var container = canvas.parentElement;

                // Siempre full window para el contenedor y CSS del canvas
                container.style.width  = "100%";
                container.style.height = "100%";
                container.style.top    = "0px";
                container.style.left   = "0px";

                // Tamaño visible deseado = full ventana
                var displayWidth  = window.innerWidth;
                var displayHeight = window.innerHeight;

                // Resolución de RENDER (buffer WebGL) → clamp sin tocar aspect
                var renderWidth  = Math.min(displayWidth,  MAX_RENDER_WIDTH);
                var renderHeight = Math.min(displayHeight, MAX_RENDER_HEIGHT);

                // Aplicamos al canvas (esto controla cuántos píxeles renderiza Unity)
                if (canvas.width  !== renderWidth  || canvas.height !== renderHeight) {
                    canvas.width  = renderWidth;
                    canvas.height = renderHeight;

                    // Opcional: fuerza a Unity/Emscripten a reconocer el cambio (en algunos casos ayuda)
                    if (window.Module && Module.canvas) {
                        // A veces necesario en builds recientes
                        // Module.canvas.width = renderWidth;
                        // Module.canvas.height = renderHeight;
                    }
                }

                // El CSS ya fuerza 100%, así que el navegador upscalea automáticamente
                // No centramos ni ajustamos nada más → full stretch
            }

            createUnityInstance(canvas, config).then(function (instance) {
                // Actualizamos referencia si Unity la cambia
                canvas = instance.Module.canvas || canvas;
                onResize();           // Inicial
            }).catch(err => console.error("Unity load error:", err));

            window.addEventListener('resize', onResize);
            onResize();  // Llamada inicial
        </script>
    </div>
</body>
</html>
