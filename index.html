<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Digi4ECO</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">

    <style>
        html, body {
            background: #CCCCCC;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #gameContainer {
            position: absolute;
            inset: 0;
            margin: 0;
            padding: 0;
            width: 100% !important;
            height: 100% !important;
            background: transparent !important;
        }

        #gameContainer canvas {
            position: absolute;
            inset: 0;
            width: 100% !important;     /* Fuerza visible 100% */
            height: 100% !important;    /* Fuerza visible 100% */
            -webkit-user-select: none;
            user-select: none;
            /*image-rendering: pixelated;*/
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <canvas id="unity-canvas" tabindex="-1"></canvas>

        <script src="Build/Digi4ECO-WebGL-PRE.loader.js"></script>
        <script>
            var canvas = document.querySelector("#unity-canvas");

            var config = {
                dataUrl: "Build/Digi4ECO-WebGL-PRE.data",
                frameworkUrl: "Build/Digi4ECO-WebGL-PRE.framework.js",
                codeUrl: "Build/Digi4ECO-WebGL-PRE.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "UPC",
                productName: "Digi4ECO",
                productVersion: "1.0.5",
                autoSyncPersistentDataPath: true,

                // ¡Importante! Desactiva la sincronización automática
                matchWebGLToCanvasSize: false
            };

            // Nuevos valores: límites de resolución interna (cámbialos a tu gusto)
			let GAME_ASPECT = 1920 / 1080;
            let MAX_RENDER_WIDTH  = 1920;
            let MAX_RENDER_HEIGHT = 1080;

			let forcedRenderWidth = -1;
			let forcedRenderHeight = -1;

			window.SetResolution = function(width, height, fullscreen) {
				// 1. Manejo de resolución
				if (width > 0 && height > 0) {
					forcedRenderWidth = width;
					forcedRenderHeight = height;
				} else {
					forcedRenderWidth = -1;
					forcedRenderHeight = -1;
				}

				// 2. Manejo de fullscreen (solo funciona si se llama desde input usuario)
				if (fullscreen !== undefined) {
					if (fullscreen) {
						if (canvas.requestFullscreen) {
							canvas.requestFullscreen().catch(e => console.warn("Fullscreen denegado:", e));
						}
					} else {
						if (document.exitFullscreen) {
							document.exitFullscreen().catch(e => console.warn("Exit fullscreen error:", e));
						}
					}
				}

				// Recalcula inmediatamente
				onResize();
			};

            function onResize() {
                var container = canvas.parentElement;

                // Siempre full window para el contenedor y CSS del canvas
                container.style.width  = "100%";
                container.style.height = "100%";
                container.style.top    = "0px";
                container.style.left   = "0px";

				var windowW = window.innerWidth;
				var windowH = window.innerHeight;

				var renderW, renderH;

				if (forcedRenderWidth > 0 && forcedRenderHeight > 0) {
					// Modo forzado: usa exactamente lo pedido (puede distorsionar si no coincide aspect)
					renderW = forcedRenderWidth;
					renderH = forcedRenderHeight;
				}
				else {
					// 1. Caso: ventana pequeña → render full (sin clamp), Unity escala bien
					renderW = windowW;
					renderH = windowH;

					// 2. Caso: ventana grande → clamp preservando aspect ratio del juego
					if (windowW > MAX_RENDER_WIDTH || windowH > MAX_RENDER_HEIGHT) {
						// Calculamos el tamaño clamped que quepa dentro del max, manteniendo aspect del juego
						var scaleW = MAX_RENDER_WIDTH / windowW;
						var scaleH = MAX_RENDER_HEIGHT / windowH;
						var scale  = Math.min(scaleW, scaleH);  // El factor limitante

						renderW = Math.floor(windowW * scale);
						renderH = Math.floor(windowH * scale);

						// Aseguramos no superar (por redondeo)
						renderW = Math.min(renderW, MAX_RENDER_WIDTH);
						renderH = Math.min(renderH, MAX_RENDER_HEIGHT);
					}
				}

				// Aplicamos resolución interna (render buffer)
				if (canvas.width !== renderW || canvas.height !== renderH) {
					canvas.width  = renderW;
					canvas.height = renderH;
				}
            }
			
            createUnityInstance(canvas, config).then(function (instance) {
                // Actualizamos referencia si Unity la cambia
                canvas = instance.Module.canvas || canvas;
                onResize();           // Inicial
            }).catch(err => console.error("Unity load error:", err));

            window.addEventListener('resize', onResize);
            onResize();  // Llamada inicial
        </script>
    </div>
</body>
</html>
