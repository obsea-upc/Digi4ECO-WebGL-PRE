<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Digi4ECO</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">

    <style>
        html, body {
            background: #ffffff;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #gameContainer {
            position: absolute;
            inset: 0;
            margin: 0;
            padding: 0;
            width: 100% !important;
            height: 100% !important;
            background: transparent !important;
        }

        #gameContainer canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Eliminado completamente el soporte para pixel art (como pediste) */
    </style>
</head>

<body>
    <div id="gameContainer">
        <canvas id="unity-canvas" tabindex="-1"></canvas>

        <script src="Build/Digi4ECO-WebGL-PRE.loader.js"></script>
        <script>
            var canvas = document.querySelector("#unity-canvas");
            var config = {
                dataUrl: "Build/Digi4ECO-WebGL-PRE.data",
                frameworkUrl: "Build/Digi4ECO-WebGL-PRE.framework.js",
                codeUrl: "Build/Digi4ECO-WebGL-PRE.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "UPC",
                productName: "Digi4ECO",
                productVersion: "1.0.2",
                autoSyncPersistentDataPath: true,
            };

            // Leemos directamente desde Unity (sin fallback forzado)
            var scaleToFit;
            try {
                scaleToFit = !!JSON.parse("true");   // true/false según Player Settings
            } catch (e) {
                scaleToFit = true;   // fallback mínimo si Unity no lo pasa (raro)
            }

            // Nuevo parámetro: Maintain Aspect Ratio (agrega en Player Settings vía C# como booleano)
            var maintainAspectRatio;
            try {
                maintainAspectRatio = !!JSON.parse("false");
            } catch (e) {
                maintainAspectRatio = true;   // por defecto mantiene ratio
            }

            function progressHandler(progress) {
                // Barra simple (puedes mejorar o quitar)
                canvas.style.background = 'linear-gradient(to right, #222, #222 ' + (progress * 100) + '%, transparent ' + (progress * 100) + '%)';
            }

            function onResize() {
                var container = canvas.parentElement;
                var targetW, targetH;

                if (scaleToFit) {
                    var windowW = window.innerWidth;
                    var windowH = window.innerHeight;

                    if (maintainAspectRatio) {
                        // Modo original: mantiene ratio → letterbox/pillarbox
                        var gameRatio = 1080 / 1920;
                        targetW = windowW;
                        targetH = Math.floor(targetW * gameRatio);

                        if (targetH > windowH) {
                            targetH = windowH;
                            targetW = Math.floor(targetH / gameRatio);
                        }
                    } else {
                        // Llena 100% sin importar ratio (estira)
                        targetW = windowW;
                        targetH = windowH;
                    }

                    container.style.width = targetW + "px";
                    container.style.height = targetH + "px";
                    container.style.top = Math.floor((window.innerHeight - targetH) / 2) + "px";
                    container.style.left = Math.floor((window.innerWidth - targetW) / 2) + "px";
                } else {
                    // No scale: tamaño fijo del juego, centrado
                    targetW = 1920;
                    targetH = 1080;
                    container.style.width = targetW + "px";
                    container.style.height = targetH + "px";
                    container.style.top = Math.floor((window.innerHeight - targetH) / 2) + "px";
                    container.style.left = Math.floor((window.innerWidth - targetW) / 2) + "px";
                }

                canvas.style.width = targetW + "px";
                canvas.style.height = targetH + "px";
                window.focus();
            }

            createUnityInstance(canvas, config, progressHandler).then(function (instance) {
                canvas = instance.Module.canvas || canvas;
                onResize();
            }).catch(err => console.error("Unity load error:", err));

            window.addEventListener('resize', onResize);
            onResize();
        </script>
    </div>
</body>
</html>
