<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Digi4ECO</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
	
    <style>
        html, body {
            background: #CCCCCC;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #gameContainer {
            position: absolute;
            inset: 0;
            margin: 0;
            padding: 0;
            width: 100% !important;
            height: 100% !important;
            background: transparent !important;
        }

        #gameContainer canvas {
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            -webkit-user-select: none;
            user-select: none;
            /*image-rendering: pixelated;*/
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <canvas id="unity-canvas" tabindex="-1"></canvas>

        <script src="Build/Digi4ECO-WebGL-PRE.loader.js"></script>
        <script>
            var canvas = document.querySelector("#unity-canvas");

            var config = {
                dataUrl: "Build/Digi4ECO-WebGL-PRE.data",
                frameworkUrl: "Build/Digi4ECO-WebGL-PRE.framework.js",
                codeUrl: "Build/Digi4ECO-WebGL-PRE.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "UPC",
                productName: "Digi4ECO",
                productVersion: "1.2",
                autoSyncPersistentDataPath: true,

                // Disable auto sync
                matchWebGLToCanvasSize: false
            };

			const IS_MOBILE = /Mobi|Android|iPad|iPhone|BlackBerry|webOS|Opera Mini|IEMobile/i.test(navigator.userAgent);
			const DEVICE_PIXEL_RATIO = window.devicePixelRatio || 1;
            let MAX_RENDER_WIDTH  = 1920;
            let MAX_RENDER_HEIGHT = 1080;
			let FULL_SCREEN = false;

			window.SetResolution = function(width, height, fullscreen) {

				if (width > 0 && height > 0) {
					MAX_RENDER_WIDTH  = width;
					MAX_RENDER_HEIGHT = height;
					FULL_SCREEN = (fullscreen !== undefined && fullscreen);
				}

				if (fullscreen !== undefined) {
					if (fullscreen) {
						if (canvas.requestFullscreen) {
							canvas.requestFullscreen().catch(e => console.warn("Set Fullscreen On error:", e));
						}
					} else {
						if (document.exitFullscreen) {
							document.exitFullscreen().catch(e => console.warn("Set Fullscreen Off error:", e));
						}
					}
				}

				onResize();
			};
			
            function onResize() {
			
                var container = canvas.parentElement;

                container.style.width  = "100%";
                container.style.height = "100%";
                container.style.top    = "0px";
                container.style.left   = "0px";

				var windowW = window.innerWidth;
				var windowH = window.innerHeight;

				var renderW = windowW;
				var renderH = windowH;
								
				if (IS_MOBILE) {
					renderW = Math.floor(windowW * DEVICE_PIXEL_RATIO);
					renderH = Math.floor(windowH * DEVICE_PIXEL_RATIO);
				}
				else
				{
					if (FULL_SCREEN) {
						renderW = Math.min(windowW, MAX_RENDER_WIDTH);
						renderH = Math.min(windowH, MAX_RENDER_HEIGHT);
					}
					else
					{
						if (windowW > MAX_RENDER_WIDTH || windowH > MAX_RENDER_HEIGHT) {
							var scaleW = MAX_RENDER_WIDTH / windowW;
							var scaleH = MAX_RENDER_HEIGHT / windowH;
							var scale  = Math.min(scaleW, scaleH);

							renderW = Math.floor(windowW * scale);
							renderH = Math.floor(windowH * scale);

							// Limits
							renderW = Math.min(renderW, MAX_RENDER_WIDTH);
							renderH = Math.min(renderH, MAX_RENDER_HEIGHT);
						}
					}
				}
				
				// Apply internal resolution (render buffer)
				if (canvas.width !== renderW || canvas.height !== renderH) {
					canvas.width  = renderW;
					canvas.height = renderH;
				}
            }

			document.addEventListener('fullscreenchange', function() {
				var isFullscreen = !!document.fullscreenElement;

				if (isFullscreen !== FULL_SCREEN) {
					FULL_SCREEN = isFullscreen;
					
					onResize();
				}
			});			
			
            createUnityInstance(canvas, config).then(function (instance) {
                canvas = instance.Module.canvas || canvas;
                onResize();           // Inicial
            }).catch(err => console.error("Unity load error:", err));

            window.addEventListener('resize', onResize);
            onResize();  // Llamada inicial
        </script>
    </div>
</body>
</html>
